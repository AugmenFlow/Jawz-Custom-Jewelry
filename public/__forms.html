<!DOCTYPE html>
<html>
  <!-- Not a page. Netlify reads this at deploy time to register the booking form used by the site. -->
  <body>
    <form name="booking" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="booking" />
      <input name="bot-field" />
      <input name="subject" />
      <input name="booking-id" />
      <input name="service" />
      <input name="name" />
      <input name="phone" />
      <input name="email" type="email" />
      <input name="instagram" />
      <input name="contact-method" />
      <input name="date" />
      <input name="time" />
      <input name="top-teeth" />
      <input name="bottom-teeth" />
      <input name="material" />
      <input name="cuts" />
      <input name="setting-style" />
      <textarea name="design"></textarea>
      <input name="design-link" />
      <textarea name="notes"></textarea>
      <input name="estimate" />
      <input name="consultation" />
      <input name="pieces" />
      <input name="stone" />
      <input name="size" />
      <input name="budget" />
      <input name="promo-code" />
    </form>
  </body>
</html>
